<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Unified Cosmic Psyche v2: Atomic Memeplexes</title>
    
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        body { margin: 0; background-color: #020617; color: white; overflow: hidden; font-family: ui-sans-serif, system-ui, sans-serif; }
        .tab-btn { padding: 0.5rem 1rem; border-bottom: 2px solid transparent; transition: all 0.2s; cursor: pointer; color: #94a3b8; }
        .tab-btn.active { border-bottom-color: #6366f1; color: white; }
        
        /* Cosmic CSS */
        @keyframes spin-slow { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        .accretion-disk { animation: spin-slow 4s linear infinite; }
        .wormhole { background: conic-gradient(from 0deg, #06b6d4, #10b981, #06b6d4); filter: blur(4px); animation: spin-slow 8s linear infinite reverse; }
    </style>
</head>
<body>

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- DATA ARCHITECTURE ---
        const systemData = {
            blackHoles: [{ id: 'bh1', name: 'The Void (Addiction Singularity)', x: 800, y: 550, radius: 50, color: '#1e1b4b', eventHorizon: 90 }],
            wormholes: [{ id: 'w1', name: 'Heuristic Shortcut', inX: 250, inY: 200, outX: 750, outY: 450, color: '#22d3ee' }],
            memeplexes: [
                { id: 'm1', name: 'Cultural Standard', x: 500, y: 150, color: '#fcd34d', radius: 150 },
            ],
            // PARTS ARE NOW "ATOMS" (1 Core, 6 Satellites)
            parts: [
                { id: 'p1', name: 'The Manager', x: 400, y: 300, vx: 0, vy: 0, color: '#60a5fa', satellites: ['Scheduling', 'Critique', 'Posture Control', 'Anxiety Spike', 'Email Checking', 'Fixer Urge'] },
                { id: 'p2', name: 'The Exile', x: 500, y: 400, vx: 0, vy: 0, color: '#a78bfa', satellites: ['Abandonment Fear', 'Chest Tightness', 'Tears', 'Isolation Urge', 'Memory Flashback', 'Shame'] },
                { id: 'p3', name: 'The Firefighter', x: 350, y: 450, vx: 0, vy: 0, color: '#f87171', satellites: ['Impulse', 'Numbing', 'Rationalization', 'Dopamine Hunt', 'Dissociation', 'Urgency'] },
                { id: 'p7', name: 'The Observer', x: 600, y: 300, vx: 0, vy: 0, color: '#ffffff', isSelf: true, satellites: ['Curiosity', 'Compassion', 'Clarity', 'Calm', 'Confidence', 'Courage'] }
            ],
            filaments: [
                { source: 'p1', target: 'p2' }, 
                { source: 'p2', target: 'p3' }, 
                { source: 'p1', target: 'p7' }
            ]
        };

        // --- COMPONENTS ---

        // 1. COSMIC CANVAS (Physics Engine)
        const CosmicCanvas = () => {
            const [parts, setParts] = useState(systemData.parts);
            const [time, setTime] = useState(0);
            const requestRef = useRef();

            const updatePhysics = () => {
                setTime(t => t + 0.02); 
                
                setParts(currentParts => {
                    return currentParts.map(part => {
                        if (part.isDragging) return part;
                        let { x, y, vx, vy } = part;

                        // Black Hole Gravity
                        systemData.blackHoles.forEach(bh => {
                            const dx = bh.x - x; const dy = bh.y - y;
                            const dist = Math.sqrt(dx*dx + dy*dy);
                            if (dist < bh.eventHorizon) {
                                vx += dx * 0.1; vy += dy * 0.1;
                            } else if (dist < 300) {
                                vx += (dx * 0.8) / (dist * 0.05) * 0.001;
                                vy += (dy * 0.8) / (dist * 0.05) * 0.001;
                            }
                        });

                        // Repulsion & Friction
                        currentParts.forEach(other => {
                            if (other.id !== part.id) {
                                const dx = x - other.x; const dy = y - other.y;
                                const dist = Math.sqrt(dx*dx + dy*dy);
                                if (dist < 80) { vx += (dx / dist) * 0.5; vy += (dy / dist) * 0.5; }
                            }
                        });

                        vx *= 0.96; vy *= 0.96;
                        if (x < 0 || x > window.innerWidth) vx *= -1;
                        if (y < 0 || y > window.innerHeight) vy *= -1;

                        return { ...part, x: x + vx, y: y + vy, vx, vy };
                    });
                });
                requestRef.current = requestAnimationFrame(updatePhysics);
            };

            useEffect(() => {
                requestRef.current = requestAnimationFrame(updatePhysics);
                return () => cancelAnimationFrame(requestRef.current);
            }, []);

            const handleDragStart = (id, e) => {
                setParts(prev => prev.map(p => p.id === id ? { ...p, isDragging: true } : p));
                const handleMouseMove = (ev) => setParts(prev => prev.map(p => p.id === id ? { ...p, x: ev.clientX, y: ev.clientY, vx: 0, vy: 0 } : p));
                const handleMouseUp = () => {
                    setParts(prev => prev.map(p => p.id === id ? { ...p, isDragging: false } : p));
                    window.removeEventListener('mousemove', handleMouseMove);
                    window.removeEventListener('mouseup', handleMouseUp);
                };
                window.addEventListener('mousemove', handleMouseMove);
                window.addEventListener('mouseup', handleMouseUp);
            };

            return (
                <div className="relative w-full h-full overflow-hidden select-none">
                    <svg className="absolute inset-0 w-full h-full pointer-events-none">
                        <rect width="100%" height="100%" fill="#020617" />
                        
                        {systemData.blackHoles.map(bh => (
                            <g key={bh.id}>
                                <circle cx={bh.x} cy={bh.y} r={bh.radius * 1.5} fill={`url(#grad-${bh.id})`} opacity="0.6" className="accretion-disk"/>
                                <circle cx={bh.x} cy={bh.y} r={bh.radius} fill="black" stroke={bh.color} strokeWidth="2" />
                                <defs>
                                    <radialGradient id={`grad-${bh.id}`}><stop offset="40%" stopColor="black" /><stop offset="80%" stopColor={bh.color} /><stop offset="100%" stopColor="transparent" /></radialGradient>
                                </defs>
                                <text x={bh.x} y={bh.y} textAnchor="middle" fill="white" fontSize="10" opacity="0.5">SINGULARITY</text>
                            </g>
                        ))}

                        {systemData.filaments.map((f, i) => {
                            const s = parts.find(p => p.id === f.source);
                            const t = parts.find(p => p.id === f.target);
                            if (!s || !t) return null;
                            return <line key={i} x1={s.x} y1={s.y} x2={t.x} y2={t.y} stroke="rgba(255,255,255,0.15)" strokeWidth="1" strokeDasharray="5,5" />;
                        })}
                    </svg>

                    {parts.map(part => {
                        const orbitRadius = 35; 
                        return (
                            <div key={part.id} 
                                onMouseDown={(e) => handleDragStart(part.id, e)}
                                className="absolute transform -translate-x-1/2 -translate-y-1/2 cursor-grab active:cursor-grabbing z-10"
                                style={{ left: part.x, top: part.y }}
                            >
                                <div className="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 w-8 h-8 rounded-full z-20 shadow-[0_0_15px_rgba(255,255,255,0.2)]"
                                     style={{ backgroundColor: part.color }}>
                                </div>
                                
                                {part.satellites.map((meme, index) => {
                                    const angle = time * (part.isSelf ? 0.5 : 1.5) + (index * (Math.PI / 3));
                                    const sx = Math.cos(angle) * orbitRadius;
                                    const sy = Math.sin(angle) * orbitRadius;
                                    
                                    return (
                                        <div key={index} 
                                            className="absolute w-3 h-3 rounded-full bg-slate-800 border border-slate-500 z-10 flex items-center justify-center group"
                                            style={{ 
                                                top: `calc(50% + ${sy}px)`, 
                                                left: `calc(50% + ${sx}px)`,
                                                transform: 'translate(-50%, -50%)'
                                            }}
                                        >
                                            <div className="hidden group-hover:block absolute -top-6 text-[9px] bg-black text-white px-1 py-0.5 rounded whitespace-nowrap">
                                                {meme}
                                            </div>
                                        </div>
                                    )
                                })}

                                <div className="absolute top-16 left-1/2 -translate-x-1/2 text-[10px] text-slate-300 whitespace-nowrap bg-black/50 px-2 py-1 rounded">
                                    {part.name} (Memeplex)
                                </div>
                            </div>
                        )
                    })}
                </div>
            );
        };

        // 2. SCHEMA VIEW
        const SchemaView = () => (
            <div className="p-8 h-full overflow-y-auto bg-slate-900">
                <h2 className="text-xl font-bold mb-6 text-indigo-400">Ontological Schema: The Fractal Psyche</h2>
                
                <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                    <div className="bg-slate-800 p-5 rounded-lg border border-slate-700">
                        <h3 className="text-lg font-bold text-amber-400 mb-2">1. The Macro (Fields)</h3>
                        <p className="text-sm text-slate-400 mb-4">Background radiation of the system. Sets the rules of gravity.</p>
                        <ul className="text-sm font-mono text-slate-300 space-y-2">
                            <li>> Cultural Programming</li>
                            <li>> Traumatic Black Holes</li>
                            <li>> Heuristic Wormholes</li>
                        </ul>
                    </div>
                    
                    <div className="bg-slate-800 p-5 rounded-lg border border-slate-700">
                        <h3 className="text-lg font-bold text-indigo-400 mb-2">2. The Meso (Memeplexes)</h3>
                        <p className="text-sm text-slate-400 mb-4">The "Parts". Atomic coalitions of behavioral patterns acting as an identity.</p>
                        <ul className="text-sm font-mono text-slate-300 space-y-2">
                            <li>> Primary Directives (Core)</li>
                            <li>> Affinity/Repulsion Rules</li>
                            <li>> Gravitational Mass</li>
                        </ul>
                    </div>

                    <div className="bg-slate-800 p-5 rounded-lg border border-slate-700">
                        <h3 className="text-lg font-bold text-emerald-400 mb-2">3. The Micro (Memes)</h3>
                        <p className="text-sm text-slate-400 mb-4">Hebbian neural assemblies. The electrons orbiting the core wound.</p>
                        <ul className="text-sm font-mono text-slate-300 space-y-2">
                            <li>> Somatic Responses (Body)</li>
                            <li>> Linguistic Loops (Thoughts)</li>
                            <li>> Affective States (Emotions)</li>
                        </ul>
                    </div>
                </div>

                <div className="mt-8 bg-slate-950 p-6 rounded-lg font-mono text-xs text-green-400 border border-slate-800">
                    // JSON Structure Example: "The Firefighter" Part <br/><br/>
                    {JSON.stringify({
                        id: "p3",
                        classification: "Memeplex (Part)",
                        core_directive: "Extinguish immediate pain at all costs",
                        orbiting_memes: [
                            { type: "somatic", pattern: "chest tightness" },
                            { type: "cognitive", pattern: "rationalization shortcut" },
                            { type: "behavioral", pattern: "substance seeking" }
                        ],
                        environmental_status: "Trapped in Addiction Singularity"
                    }, null, 2).replace(/\n/g, '<br/>').replace(/ /g, '&nbsp;')}
                </div>
            </div>
        );

        // 3. MIND MAP VIEW
        const MindMapView = () => (
            <div className="p-8 h-full flex items-center justify-center overflow-auto bg-slate-900">
                <div className="flex flex-col items-center">
                    
                    <div className="bg-white text-black px-6 py-3 rounded-full font-bold shadow-[0_0_20px_rgba(255,255,255,0.3)] z-10">
                        The Organism (Self)
                    </div>
                    
                    <div className="w-px h-8 bg-slate-600"></div>
                    
                    <div className="flex gap-16 relative">
                        <div className="absolute top-0 left-[10%] right-[10%] h-px bg-slate-600"></div>

                        {systemData.parts.map(part => (
                            <div key={part.id} className="flex flex-col items-center relative pt-4">
                                <div className="w-px h-4 bg-slate-600 absolute top-0"></div>
                                
                                <div className="bg-slate-800 border-2 px-4 py-2 rounded-lg text-sm font-bold z-10 mb-4 whitespace-nowrap" style={{ borderColor: part.color }}>
                                    {part.name}
                                </div>
                                
                                <div className="flex flex-col gap-2 pl-4 border-l border-slate-700">
                                    {part.satellites.slice(0, 4).map((meme, i) => (
                                        <div key={i} className="flex items-center text-xs text-slate-400">
                                            <div className="w-4 h-px bg-slate-700 mr-2"></div>
                                            {meme}
                                        </div>
                                    ))}
                                    <div className="text-xs text-slate-600 italic pl-6">+ 2 more engrams</div>
                                </div>
                            </div>
                        ))}
                    </div>
                </div>
            </div>
        );

        // --- MAIN APP CONTAINER ---
        const App = () => {
            const [activeTab, setActiveTab] = useState('canvas');

            return (
                <div className="flex flex-col h-screen">
                    <div className="bg-slate-950 border-b border-slate-800 p-4 flex justify-between items-center">
                        <div className="flex items-center gap-3">
                            <span className="text-2xl">🌌</span>
                            <h1 className="text-xl font-bold tracking-tight">Psyche-OS <span className="text-slate-500 text-sm font-normal">v2.0 Fractals</span></h1>
                        </div>
                        
                        <div className="flex gap-2">
                            <button className={`flex items-center gap-2 tab-btn ${activeTab === 'canvas' ? 'active' : ''}`} onClick={() => setActiveTab('canvas')}>
                                ⚛️ Cosmic Canvas
                            </button>
                            <button className={`flex items-center gap-2 tab-btn ${activeTab === 'schema' ? 'active' : ''}`} onClick={() => setActiveTab('schema')}>
                                🗄️ Data Schema
                            </button>
                            <button className={`flex items-center gap-2 tab-btn ${activeTab === 'mindmap' ? 'active' : ''}`} onClick={() => setActiveTab('mindmap')}>
                                🧠 Mind Map
                            </button>
                        </div>
                    </div>

                    <div className="flex-1 relative">
                        {activeTab === 'canvas' && <CosmicCanvas />}
                        {activeTab === 'schema' && <SchemaView />}
                        {activeTab === 'mindmap' && <MindMapView />}
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
